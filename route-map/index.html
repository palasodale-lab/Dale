            display:flex;align-items:center;justify-content:center;box-shadow:0 0 22px rgba(242,195,91,.8)}

<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div id="ui"></div>
</div>
<script src="node_modules/d3-array/dist/d3-array.min.js"></script>
<script src="node_modules/d3-geo/dist/d3-geo.min.js"></script>
<script src="node_modules/topojson-client/dist/topojson-client.min.js"></script>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';

const W = 1920, H = 1080, DPR = window.devicePixelRatio || 1;
const D2R = Math.PI/180;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const smooth=t=>t*t*t*(t*(t*6-15)+10);
// fade in over [a,a+fi], hold, fade out over [b-fo,b]
const win=(t,a,b,fi=.6,fo=.6)=>Math.min(clamp((t-a)/fi), b==null?1:clamp((b-t)/fo));
const prog=(t,a,b)=>clamp((t-a)/(b-a));

function vec(lat,lon,r=1){ const p=lat*D2R,l=lon*D2R; return new THREE.Vector3(r*Math.cos(p)*Math.cos(l), r*Math.sin(p), -r*Math.cos(p)*Math.sin(l)); }
function slerpLL(a,b,t){ // great-circle interpolation between [lat,lon]
  const A=vec(a[0],a[1]),B=vec(b[0],b[1]); const om=A.angleTo(B);
  if(om<1e-9) return A; const s=Math.sin(om);
  return A.multiplyScalar(Math.sin((1-t)*om)/s).add(B.multiplyScalar(Math.sin(t*om)/s));
}

// ---------- data ----------
const P = {
  POM:[-9.443,147.22], GZ:[23.135,113.33], FS:[23.02,113.12], ZS:[22.517,113.392],
  TSN:[39.124,117.346], CZ:[38.304,116.839], BX:[37.15,118.13], CAN:[23.392,113.299]
};
const F1=[37.23,118.03], F2=[37.09,118.24], F3=[37.21,118.27];

// ---------- renderer ----------
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true,logarithmicDepthBuffer:true});
renderer.setPixelRatio(DPR); renderer.setSize(W,H,false);
renderer.setClearColor(0x040a18,1);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,W/H,0.001,50);

// background stars
{
  const n=2600, pos=new Float32Array(n*3), col=new Float32Array(n*3); let s=7;
  const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<n;i++){ const u=rnd()*2-1,th=rnd()*Math.PI*2,r=30; const q=Math.sqrt(1-u*u);
    pos.set([r*q*Math.cos(th),r*u,r*q*Math.sin(th)],i*3); const b=.25+rnd()*.6; col.set([b*.8,b*.88,b],i*3); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('color',new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.6*DPR,sizeAttenuation:false,vertexColors:true,transparent:true,opacity:.8,depthWrite:false})));
}

const loader=new THREE.TextureLoader();
const loadTex=u=>new Promise(r=>loader.load(u,t=>{t.anisotropy=8;r(t)}));
const [texDay,texTopo]=await Promise.all([
  loadTex('node_modules/three-globe/example/img/earth-blue-marble.jpg'),
  loadTex('node_modules/three-globe/example/img/earth-topology.png')]);
texDay.colorSpace=THREE.NoColorSpace;

const topo=await (await fetch('node_modules/world-atlas/countries-10m.json')).json();
// hi-res land mask
const maskC=document.createElement('canvas'); maskC.width=8192; maskC.height=4096;
{
  const ctx=maskC.getContext('2d'); ctx.fillStyle='#000'; ctx.fillRect(0,0,8192,4096);
  const proj=d3.geoEquirectangular().scale(8192/(2*Math.PI)).translate([4096,2048]);
  const path=d3.geoPath(proj,ctx); ctx.fillStyle='#fff'; for(const ft of topojson.feature(topo,topo.objects.countries).features){ if(ft.id==='010'||!ft.geometry) continue;
    const polys=ft.geometry.type==='Polygon'?[ft.geometry.coordinates]:ft.geometry.coordinates;
    for(const poly of polys){ let g={type:'Polygon',coordinates:poly}; if(d3.geoArea(g)>2*Math.PI) g={type:'Polygon',coordinates:poly.map(r=>r.slice().reverse())};
      ctx.beginPath(); path(g); ctx.fill(); } }
}
const texMask=new THREE.CanvasTexture(maskC); texMask.anisotropy=8; texMask.generateMipmaps=true; texMask.minFilter=THREE.LinearMipmapLinearFilter;

const globeMat=new THREE.ShaderMaterial({
  uniforms:{day:{value:texDay},topo:{value:texTopo},mask:{value:texMask},camPos:{value:new THREE.Vector3()},detail:{value:0},glow:{value:1}},
  vertexShader:`
    #include <common>
    #include <logdepthbuf_pars_vertex>
    varying vec2 vUv; varying vec3 vN; varying vec3 vW;
    void main(){ vUv=uv; vN=normalize(position); vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz;
      gl_Position=projectionMatrix*viewMatrix*w;
      #include <logdepthbuf_vertex>
    }`,
  fragmentShader:`
    #include <logdepthbuf_pars_fragment>
    uniform sampler2D day,topo,mask; uniform vec3 camPos; uniform float detail,glow;
    varying vec2 vUv; varying vec3 vN; varying vec3 vW;
    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
    void main(){
      #include <logdepthbuf_fragment>
      vec3 c=texture2D(day,vUv).rgb; float lum=dot(c,vec3(.3,.59,.11));
      float land=texture2D(mask,vUv).r;
      vec2 px=vec2(1./2048.,1./1024.);
      float h=texture2D(topo,vUv).r;
      float hx=texture2D(topo,vUv+vec2(px.x,0.)).r-texture2D(topo,vUv-vec2(px.x,0.)).r;
      float hy=texture2D(topo,vUv+vec2(0.,px.y)).r-texture2D(topo,vUv-vec2(0.,px.y)).r;
      // fine procedural relief for close-ups
      vec2 q=vUv*vec2(4096.,2048.)*14.;
      float n1=detail>0.?noise(q)*.6+noise(q*2.3)*.4:0.5;
      float hill=clamp(.55+(-hx*1.6+hy*1.6)*6.0,0.,1.);
      vec3 ocean=mix(vec3(.012,.035,.09),vec3(.02,.07,.16),clamp(lum*3.,0.,1.));
      vec3 landc=mix(vec3(.05,.12,.25),vec3(.12,.24,.42),clamp(lum*2.2,0.,1.));
      landc*= mix(.62+.75*hill, .85+.3*hill, detail);
      landc+= detail*(n1-.5)*vec3(.02,.04,.07);
      // glowing topographic contours
      float ch=h*14.+n1*detail*.15; float fw=fwidth(ch);
      float contour = (1.-smoothstep(0.,fw*1.5,min(fract(ch),1.-fract(ch))));
      landc+= contour*smoothstep(.04,.5,h)*vec3(.12,.32,.55)*.55*glow;
      landc+= smoothstep(.25,.9,h)*vec3(.08,.2,.35)*.6;
      // close-up tech dot matrix + fine graticule
      vec2 dg=vUv*vec2(360.,180.)*12.; vec2 dc=fract(dg)-.5; float dfw=fwidth(dg.x);
      float spc=1./max(dfw,1e-5); float dotm=(1.-smoothstep(.06,.06+dfw*1.2,length(dc)))*detail*clamp((spc-7.)/6.,0.,1.)*clamp((60.-spc)/25.,0.,1.);
      landc+=dotm*vec3(.15,.3,.5)*.45;
      vec2 fg=vUv*vec2(360.,180.); vec2 ff=abs(fract(fg)-.5); vec2 fw2=fwidth(fg);
      float fl=max(1.-smoothstep(0.,fw2.x*1.2,.5-ff.x),1.-smoothstep(0.,fw2.y*1.2,.5-ff.y))*detail;
      vec3 col=mix(ocean,landc,land);
      col+=fl*vec3(.15,.25,.45)*.35;
      // lat/lon grid
      vec2 g=vec2(vUv.x*36.,vUv.y*18.); vec2 gf=abs(fract(g)-.5); vec2 gw=fwidth(g);
      float gl=max(1.-smoothstep(0.,gw.x*1.2,.5-gf.x),1.-smoothstep(0.,gw.y*1.2,.5-gf.y));
      col+= gl*vec3(.12,.2,.35)*.35;
      // view lighting + rim
      vec3 V=normalize(camPos-vW); float nd=clamp(dot(vN,V),0.,1.);
      col*= .55+.6*pow(nd,.6);
      col+= pow(1.-nd,3.)*vec3(.15,.35,.75)*.9;
      gl_FragColor=vec4(col,1.);
    }`
});
globeMat.extensions={derivatives:true};
const globe=new THREE.Mesh(new THREE.SphereGeometry(1,360,180),globeMat);
scene.add(globe);

// atmosphere
const atm=new THREE.Mesh(new THREE.SphereGeometry(1.06,128,64),new THREE.ShaderMaterial({
  uniforms:{camPos:{value:new THREE.Vector3()}},
  vertexShader:`#include <common>
    #include <logdepthbuf_pars_vertex>
    varying vec3 vN; varying vec3 vW; void main(){vN=normalize(position);vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;
    #include <logdepthbuf_vertex>
    }`,
  fragmentShader:`#include <logdepthbuf_pars_fragment>
    uniform vec3 camPos; varying vec3 vN; varying vec3 vW;
    void main(){
      #include <logdepthbuf_fragment>
      vec3 V=normalize(camPos-vW); float d=dot(vN,V); float a=pow(clamp(1.-abs(d),0.,1.),5.)*1.3;
      gl_FragColor=vec4(vec3(.25,.55,1.)*a,a);}`,
  side:THREE.BackSide,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(atm);

// coastlines & borders
const fatMats=[];
function segGeom(mls,r,box){
  const arr=[]; const inb=p=>!box||(p[0]>=box[0]&&p[0]<=box[2]&&p[1]>=box[1]&&p[1]<=box[3]);
  for(const line of mls.coordinates){ for(let i=0;i<line.length-1;i++){ if(!inb(line[i])&&!inb(line[i+1])) continue; const a=vec(line[i][1],line[i][0],r),b=vec(line[i+1][1],line[i+1][0],r); arr.push(a.x,a.y,a.z,b.x,b.y,b.z);} }
  const g=new LineSegmentsGeometry(); g.setPositions(arr); return g;
}
function lmat(color,width,opacity,add=false){
  const m=new LineMaterial({color,linewidth:width*DPR,transparent:true,opacity,depthWrite:false,blending:add?THREE.AdditiveBlending:THREE.NormalBlending});
  m.resolution.set(W*DPR,H*DPR); fatMats.push(m); return m;
}
const topo50=await (await fetch('node_modules/world-atlas/countries-50m.json')).json();
const mk=(o,G)=>{const l=new LineSegments2(G,o); l.frustumCulled=false; scene.add(l); return l;};
const AS=[95,-25,165,50];               // region of interest for far LOD
const NEAR=[108,20,124,42];             // China close-up region for 10m detail
const c50=segGeom(topojson.mesh(topo50,topo50.objects.countries,(a,b)=>a===b),1.00015,AS);
const b50=segGeom(topojson.mesh(topo50,topo50.objects.countries,(a,b)=>a!==b),1.0002,AS);
const c10=segGeom(topojson.mesh(topo,topo.objects.countries,(a,b)=>a===b),1.00015,NEAR);
const b10=segGeom(topojson.mesh(topo,topo.objects.countries,(a,b)=>a!==b),1.0002,NEAR);
const coastFar=mk(lmat(0x8cc4ff,1.2,.7),c50), coastGlow=mk(lmat(0x3f8cff,4,.2,true),c50), bordFar=mk(lmat(0x9fb6dc,1,.4),b50);
const prov=await (await fetch('china_prov.json')).json();
const provL=mk(lmat(0x86a9e6,1.3,.4),segGeom(prov,1.0002,null)), provGlow=mk(lmat(0x3f7fe0,4,.12,true),segGeom(prov,1.0002,null));
const coastNear=mk(lmat(0x8cc4ff,1.5,.8),c10), coastGlowN=mk(lmat(0x3f8cff,5,.22,true),c10), bordNear=mk(lmat(0x9fb6dc,1.1,.45),b10);

// ---------- routes ----------
function densify(pts,per=60){ const out=[]; for(let i=0;i<pts.length-1;i++){ for(let k=0;k<per;k++) out.push(slerpLL(pts[i],pts[i+1],k/per)); } out.push(vec(...pts[pts.length-1])); return out; }
function airPath(a,b,n=240){ const om=vec(...a).angleTo(vec(...b)); const hgt=Math.min(.12,om*.17);
  const out=[]; for(let i=0;i<=n;i++){ const t=i/n; out.push(slerpLL(a,b,t).normalize().multiplyScalar(1.0004+hgt*Math.sin(Math.PI*t))); } return out; }
function roadPath(pts){ return densify(pts,50).map(v=>v.normalize().multiplyScalar(1.0003)); }

const routes=[];
function addRoute(o){
  const pts=o.type==='air'?airPath(o.from,o.to):roadPath(o.pts);
  o.pts=pts; o.cum=[0]; for(let i=1;i<pts.length;i++) o.cum.push(o.cum[i-1]+pts[i].distanceTo(pts[i-1]));
  o.len=o.cum[o.cum.length-1];
  if(o.draw!==false){
    const arr=[]; pts.forEach(p=>arr.push(p.x,p.y,p.z));
    const g=new LineGeometry(); g.setPositions(arr);
    o.glow=new Line2(g,lmat(0xf2a93b,11,.28,true)); o.core=new Line2(g,lmat(0xfff2cf,2.6,1));
    o.mid=new Line2(g,lmat(0xf2c35b,5,.85,true));
    for(const l of [o.glow,o.mid,o.core]){l.frustumCulled=false;l.renderOrder=5;scene.add(l);}
    o.nseg=pts.length-1;
  }
  routes.push(o); return o;
}
function at(o,u){ // point along route by arc length fraction
  const d=u*o.len; let i=1; while(i<o.cum.length-1&&o.cum[i]<d) i++;
  const f=(d-o.cum[i-1])/Math.max(1e-9,o.cum[i]-o.cum[i-1]); return o.pts[i-1].clone().lerp(o.pts[i],clamp(f));
}
const R={
  pomCan: addRoute({type:'air',from:P.POM,to:P.GZ,t0:8.6,t1:13.8,veh:'plane'}),
  gzFs:   addRoute({type:'road',pts:[P.GZ,[23.10,113.25],[23.06,113.18],P.FS],t0:19.4,t1:20.9,veh:'car'}),

function camState(t){
  let i=0; while(i<K.length-2&&t>K[i+1][0]) i++;
  const a=K[i],b=K[i+1]; const s=ease(clamp((t-a[0])/(b[0]-a[0])));
  return { lat:lerp(a[1],b[1],s), lon:lerp(a[2],b[2],s), alt:Math.exp(lerp(Math.log(a[3]),Math.log(b[3]),s)), tilt:lerp(a[4],b[4],s), head:lerp(a[5],b[5],s) };

function placeCamera(t){
  const c=camState(t);

  const U=vec(c.lat,c.lon,1);
  const N=new THREE.Vector3(-Math.sin(la)*Math.cos(lo),Math.cos(la),Math.sin(la)*Math.sin(lo));
  const E=new THREE.Vector3().crossVectors(N,U);
  const h=c.head*D2R, tl=c.tilt*D2R;
  const Fd=N.clone().multiplyScalar(Math.cos(h)).add(E.clone().multiplyScalar(Math.sin(h)));
  const pos=U.clone().add(U.clone().multiplyScalar(c.alt*Math.cos(tl)).sub(Fd.clone().multiplyScalar(c.alt*Math.sin(tl))));
  camera.position.copy(pos); camera.up.copy(Fd.clone().multiplyScalar(Math.cos(tl)).add(U.clone().multiplyScalar(Math.sin(tl))));
  camera.lookAt(U);
  camera.rotateZ(Math.sin(t*.35)*.012+Math.sin(t*.13+1)*.008); // subtle drone sway
  camera.near=Math.max(c.alt*0.04,0.0004); camera.far=c.alt+4; camera.updateProjectionMatrix();

}

window.renderAt=function(t){
  const c=placeCamera(t);
  globeMat.uniforms.camPos.value.copy(camera.position); atm.material.uniforms.camPos.value.copy(camera.position);
  globeMat.uniforms.detail.value=clamp((0.2-c.alt)/0.15);
  const fin=prog(t,74.5,77.5);
  globeMat.uniforms.glow.value=1+fin*.4;
  // coast lines thinner when far
  const near=c.alt<0.25; coastNear.visible=coastGlowN.visible=bordNear.visible=near; coastFar.visible=coastGlow.visible=bordFar.visible=!near;
  provL.visible=provGlow.visible=c.alt<0.9; provL.material.opacity=.42*clamp((0.9-c.alt)/0.4)*(1-fin*.5);
  coastFar.material.opacity=lerp(.4,.75,clamp((1.6-c.alt)/1.2)); bordFar.material.opacity=lerp(.15,.45,clamp((1.6-c.alt)/1.2)); coastGlow.material.opacity=lerp(.08,.2,clamp((1.6-c.alt)/1.2));

  fc.clearRect(0,0,W,H);
  // ambient particles
  for(let i=0;i<70;i++){ const sp=.3+hash(i)*.7; const x=(hash(i+11)*W + t*12*sp)%W; const y=(hash(i+29)*H*1.2 - t*18*sp)%(H*1.2); const yy=y<0?y+H*1.2:y;
    glowDot(x,yy-H*.1,3+hash(i+5)*6,.05+.08*Math.abs(Math.sin(t*.7+i)),'160,200,255'); }

  // routes
  const finalPulse= fin>0 ? .75+.25*Math.sin(t*3.2) : 1;
  for(const o of routes){
    const u=prog(t,o.t0,o.t1); const ue= o.type==='air'? smooth(u): ease(u);
    if(o.core){ const n=Math.floor(ue*o.nseg); const shown=n>0;
      for(const l of [o.glow,o.mid,o.core]){ l.visible=shown; l.geometry.instanceCount=n; }
      o.glow.material.opacity=.3*finalPulse+fin*.15; o.mid.material.opacity=.75-fin*.25; o.core.material.opacity=1-fin*.35;
    }
    if(t>o.t0-.3 && t<o.t1+.5){
      const p=at(o,ue); const S=proj(p); const S2=proj(at(o,clamp(ue+.004)));
      const ang=Math.atan2(S2.x-S.x,-(S2.y-S.y))*180/Math.PI;
      const o2=Math.min(clamp((t-o.t0+.3)/.3),clamp((o.t1+.5-t)/.35));
      const v=vehEls[o.veh];
      if(o.veh==='plane'){ const lift=Math.sin(Math.PI*ue); place(v,S.x,S.y,o2*(S.vis?1:0),.7+.45*lift,ang); }
      else place(v,S.x,S.y-26,o2*(S.vis?1:0),1,0);
      // sparkle trail
      for(let k=1;k<16;k++){ const uu=ue-k*.006; if(uu<0) break; const q=proj(at(o,uu)); const j=hash(k*7.3+Math.floor(t*30));
        glowDot(q.x+(j-.5)*10,q.y+(hash(k+3.1+Math.floor(t*30))-.5)*10,5+k*.6,(1-k/16)*.55*o2); }
      glowDot(S.x,S.y,40,.35*o2);
    }
  }
  for(const k in vehEls){ const active=routes.some(o=>o.veh===k&&t>o.t0-.3&&t<o.t1+.5); if(!active) place(vehEls[k],0,0,0); }

  // items
  for(const it of items){
    if(it.kind==='city'){ const S=proj(vec(...it.ll,1.0002)); const o=S.vis?clamp((c.alt-it.a0)/(it.a0*.4))*clamp((it.a1-c.alt)/(it.a1*.3))*(1-fin)*.9*clamp((t-6)/1):0;
      place(it.d,S.x+0,S.y-9,o); continue; }
    const S=proj(vec(...it.ll,1.0003)); const vis=S.vis?1:0;
    if(it.kind==='pin'){
      const a=win(t,it.tIn,it.tOut,.5,.6)*vis; const pinA=(t>it.tIn? Math.max(a, .55*(1-fin)) : 0)*vis*(t>it.tIn?clamp((t-it.tIn)/.4):0);
      const drop=easeOut(clamp((t-it.tIn)/.6)); place(it.p,S.x,S.y-(1-drop)*60,pinA, it.ll===P.POM&&t>70&&t<72?0:1);
      if(a>0){ ring(S.x,S.y,10+((t*1.1)%1)*36,(1-(t*1.1)%1)*.7*a); }
      const lx=S.x+it.dx, ly=S.y+it.dy; place(it.l,lx,ly-30,a,.96+.04*a);
      leader(it.ln,S.x,S.y-40,it.dx<0?lx+it.l.firstChild.offsetWidth:lx,ly,a*.9);
    } else if(it.kind==='icon'){
      const k=clamp((t-it.tIn)/.55); const pop=k<=0?0:(1+Math.sin(k*Math.PI)*.35)*easeOut(k);
      const resid=.3*clamp((0.3-c.alt)/0.15); const o=k>0?clamp(k*3)*vis*(it.tOut?clamp((it.tOut-t)/.8)*(1-resid)+resid:Math.max(clamp((61-t)/.8),resid))*(1-fin):0;
      place(it.d,S.x,S.y-36,o,pop);
      if(o>0){ glowDot(S.x,S.y-36,60,.25*o); if(it.pulse||k<1){ for(let r=0;r<(it.pulse?3:1);r++){ const ph=((t*.8)+r/3)%1; ring(S.x,S.y-36,30+ph*70,(1-ph)*.8*o,2.5);} } }
